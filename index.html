<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thesya Gabrielle — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0e0a1f;           /* deep space */
      --bg2:#1a1038;          /* vignette */
      --grid:#241b4b;         /* subtle grid */
      --neon:#38f499;         /* mint neon */
      --magenta:#ff3ea5;      /* hot magenta */
      --amber:#ffd166;        /* retro amber */
      --white:#e8e8ff;        /* soft white */
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      color:var(--white);
      font-family:Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(1200px 600px at 50% 120%, var(--bg2) 0%, var(--bg) 55%, #06040f 100%),
        linear-gradient(180deg, rgba(255,62,165,.06), transparent 30%),
        repeating-linear-gradient(0deg, var(--grid), var(--grid) 1px, transparent 1px, transparent 40px),
        repeating-linear-gradient(90deg, #1b1340, #1b1340 1px, transparent 1px, transparent 40px);
      background-blend-mode: screen, normal, overlay, overlay;
      overflow:hidden;
    }

    /* Scanline + noise overlay */
    body::before{
      content:"";
      position:fixed; inset:0;
      background:
        repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 2px, rgba(0,0,0,.03) 2px 4px);
      mix-blend-mode:overlay; pointer-events:none; opacity:.5;
      animation: flicker 4s infinite steps(60);
    }
    body::after{
      content:""; position:fixed; inset:-50% -50%;
      background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)" opacity="0.05"/></svg>');
      opacity:.35; pointer-events:none; animation: grain 12s steps(10) infinite;
    }
    @keyframes grain{ to{ transform:translate3d(-10%,10%,0) } }
    @keyframes flicker{ 0%,19%,21%,23%,25%,54%,56%,100%{opacity:.5} 20%,24%,55%{opacity:.35} }

    .wrap{
      position:relative; inset:0; height:100dvh; display:grid; place-items:center; padding:2rem;
    }
    .crt{
      width:min(880px, 92vw);
      border-radius:20px; padding:2.2rem; position:relative;
      background: linear-gradient(180deg, rgba(255,62,165,.08), rgba(56,244,153,.08));
      box-shadow:
        0 0 0 2px rgba(255,62,165,.35) inset,
        0 0 32px rgba(56,244,153,.25),
        0 20px 80px rgba(0,0,0,.6);
      isolation:isolate;
    }
    .crt::before{
      content:""; position:absolute; inset:0; border-radius:20px;
      background: radial-gradient(120% 80% at 50% -5%, rgba(255,255,255,.15), transparent 60%);
      mix-blend-mode:screen; pointer-events:none;
    }

    .brand{
      display:flex; align-items:center; gap:1rem; margin-bottom:1.25rem;
    }
    .logo{
      width:44px; height:44px; border-radius:12px; display:grid; place-items:center;
      background:linear-gradient(135deg, var(--magenta), var(--neon));
      box-shadow:0 0 24px rgba(255,62,165,.55), 0 0 24px rgba(56,244,153,.35) inset;
      transform:rotate(-6deg);
      font-family:"Press Start 2P", system-ui; font-size:14px; color:#0b0616;
    }
    h1{
      font-family:"Press Start 2P", system-ui; font-size:clamp(20px, 3.2vw, 34px); line-height:1.25; margin:0;
      text-shadow:0 0 8px rgba(56,244,153,.35);
    }
    .tagline{ margin:.5rem 0 1.1rem; color:#cfcaf3; opacity:.9; font-size:clamp(13px,1.6vw,16px) }

    .ticker{
      font-family:"Press Start 2P", system-ui; font-size:12px; letter-spacing:.5px; color:var(--amber);
      background:linear-gradient(90deg, rgba(255,209,102,.12), transparent);
      border:1px dashed rgba(255,209,102,.4); border-radius:10px; padding:.75rem 1rem; margin:1rem 0 1.2rem;
      position:relative; overflow:hidden;
    }
    .ticker .dot{ display:inline-block; width:.7em; text-align:center; animation: blink 1.2s infinite steps(2) }
    @keyframes blink{ 50%{ opacity:.2 } }

    .countdown{
      display:flex; gap:.6rem; flex-wrap:wrap; margin:1.2rem 0 1.4rem;
    }
    .tile{
      min-width:90px; text-align:center; padding:.7rem .9rem; border-radius:12px; backdrop-filter: blur(6px);
      background:linear-gradient(180deg, rgba(255,62,165,.10), rgba(56,244,153,.10));
      border:1px solid rgba(255,255,255,.12);
      box-shadow:0 6px 18px rgba(0,0,0,.25) inset, 0 2px 16px rgba(56,244,153,.15);
    }
    .tile .num{ font-family:"Press Start 2P"; font-size:clamp(18px,3.2vw,26px); color:var(--neon); text-shadow:0 0 8px rgba(56,244,153,.25) }
    .tile .lab{ font-size:12px; opacity:.8; margin-top:.35rem }

    .buttons{ display:flex; flex-wrap:wrap; gap:.6rem; margin-top:.5rem }
    .btn{
      --p: var(--neon);
      display:inline-flex; align-items:center; gap:.5rem; text-decoration:none; color:var(--white);
      padding:.75rem 1rem; border-radius:12px; border:1px solid rgba(255,255,255,.15);
      background:linear-gradient(180deg, rgba(56,244,153,.12), rgba(255,62,165,.08));
      box-shadow:0 8px 24px rgba(0,0,0,.3), 0 0 16px color-mix(in oklab, var(--p), transparent 80%);
      transition: transform .15s ease, box-shadow .2s ease, border-color .2s ease;
    }
    .btn:hover{ transform:translateY(-2px); border-color: color-mix(in oklab, var(--p), white 15%);
      box-shadow:0 12px 28px rgba(0,0,0,.35), 0 0 22px color-mix(in oklab, var(--p), transparent 70%);
    }
    .btn.ghost{ background:transparent; border-style:dashed; opacity:.9 }

    .meta{ display:flex; justify-content:space-between; align-items:center; gap:1rem; margin-top:1rem; opacity:.85; font-size:13px }
    .meta a{ color:var(--amber); text-underline-offset:3px }

    @media (max-width:520px){ .logo{display:none} .brand{justify-content:center} .meta{flex-direction:column} }
  </style>
</head>
<body>
  <div class="wrap">
    <main class="crt" role="main" aria-labelledby="title">
      <div class="brand" aria-hidden="true">
        <div class="logo">TG</div>
        <div>
          <h1 id="title">THESYA GABRIELLE</h1>
          <div class="tagline">AI • Data • Dashboards — Portfolio loading…</div>
        </div>
      </div>

      <div class="ticker" aria-live="polite">
        <span>INSERT COIN</span> <span class="dot">▮</span>
        <span style="margin-left:.8rem">New site booting with pixel vibes & CRT glow.</span>
      </div>

      <section aria-label="Countdown" class="countdown" id="countdown">
        <div class="tile"><div class="num" id="d">00</div><div class="lab">DAYS</div></div>
        <div class="tile"><div class="num" id="h">00</div><div class="lab">HOURS</div></div>
        <div class="tile"><div class="num" id="m">00</div><div class="lab">MIN</div></div>
        <div class="tile"><div class="num" id="s">00</div><div class="lab">SEC</div></div>
      </section>

      <div class="buttons">
        <a class="btn" style="--p: var(--neon)" href="mailto:thesya.gabrielle@gmail.com" aria-label="Email Thesya">✉︎ Email me</a>
        <a class="btn" style="--p: var(--magenta)" href="#" aria-label="Download CV">⬇︎ Download CV</a>
        <a class="btn ghost" href="https://github.com/thesyagabrielle" target="_blank" rel="noopener">GitHub</a>
        <a class="btn ghost" href="https://www.linkedin.com/in/thesya-evania-gabrielle/" target="_blank" rel="noopener">LinkedIn</a>
      </div>

      <div class="meta">
        <div>© <span id="year"></span> Thesya Gabrielle</div>
        <div>Made with <span style="color:var(--magenta)">♥</span> + caffeine.</div>
      </div>
    </main>
  </div>

  <script>
    // ====== Edit this date for your launch ======
    // Format: YYYY-MM-DDTHH:MM:SS (local time). Example below sets Oct 1, 2025 at 09:00
    const LAUNCH = new Date('2025-10-01T09:00:00');

    const d=document, $=id=>d.getElementById(id);
    const dEl=$('d'), hEl=$('h'), mEl=$('m'), sEl=$('s');
    const yearEl=$('year'); yearEl.textContent=new Date().getFullYear();

    function pad(n){return String(n).padStart(2,'0')}
    function tick(){
      const now = new Date();
      let diff = LAUNCH - now;
      if(diff < 0){
        dEl.textContent=hEl.textContent=mEl.textContent=sEl.textContent='00';
        const t = d.querySelector('.ticker');
        t.innerHTML = 'We\'re live! <a href="#" style="color: var(--neon); text-decoration: underline;">Enter site</a>'; 
        clearInterval(iv); return;
      }
      const sec = Math.floor(diff/1000)%60;
      const min = Math.floor(diff/1000/60)%60;
      const hr  = Math.floor(diff/1000/60/60)%24;
      const day = Math.floor(diff/1000/60/60/24);
      dEl.textContent=pad(day); hEl.textContent=pad(hr); mEl.textContent=pad(min); sEl.textContent=pad(sec);
    }
    const iv=setInterval(tick,1000); tick();
  </script>
</body>
</html>
